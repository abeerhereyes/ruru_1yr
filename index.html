const STORAGE_KEY = 'letters:all:3';
let letters = [];
let current = 0;


const hasClaudeStorage = typeof window !== 'undefined' && !!window.storage;

async function storageGet(key){
  if(hasClaudeStorage){
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('storage timeout')), 2500));
    try{
      return await Promise.race([window.storage.get(key), timeout]);
    }catch(e){
      return null;
    }
  }
  try{
    const raw = localStorage.getItem(key);
    return raw ? { value: raw } : null;
  }catch(e){
    return null;
  }
}

async function storageSet(key, value){
  if(hasClaudeStorage){
    const timeout = new Promise((_, reject) => setTimeout(() => reject(new Error('storage timeout')), 2500));
    try{
      return await Promise.race([window.storage.set(key, value), timeout]);
    }catch(e){
      return null;
    }
  }
  try{
    localStorage.setItem(key, value);
    return { value };
  }catch(e){
    return null;
  }
}

async function persist(){
  try{
    await storageSet(STORAGE_KEY, JSON.stringify(letters));
  }catch(e){
    console.error('storage failed', e);
  }
}

function renderCard(){
  const card = document.getElementById('card');
  const subtitle = document.getElementById('subtitle');

  if(letters.length === 0){
    card.innerHTML = `<div class="empty-state">
      <div class="glyph">✦</div>
      <div>no letters yet.<br>add the first one below.</div>
    </div>`;
    subtitle.textContent = 'an empty page, waiting';
    renderDots();
    updateNavButtons();
    return;
  }

  if(current < 0) current = 0;
  if(current > letters.length - 1) current = letters.length - 1;

  const l = letters[current];
  const idx = String(current + 1).padStart(2,'0');
  const total = String(letters.length).padStart(2,'0');

  card.innerHTML = `
    <div class="card-top">
      <span class="letter-index">${l.title ? l.title : 'letter ' + idx} · ${idx} / ${total}</span>
      <span class="letter-date">${l.date ? l.date : ''}</span>
    </div>
    <div class="letter-body">${escapeHtml(l.body)}</div>
  `;

  subtitle.textContent = `${letters.length} letter${letters.length === 1 ? '' : 's'} written so far`;
  renderDots();
  updateNavButtons();
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function renderDots(){
  const dots = document.getElementById('dots');
  dots.innerHTML = '';
  letters.forEach((_, i) => {
    const d = document.createElement('button');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.onclick = () => { current = i; renderCard(); };
    dots.appendChild(d);
  });
}

function updateNavButtons(){
  document.getElementById('prevBtn').disabled = current <= 0 || letters.length === 0;
  document.getElementById('nextBtn').disabled = current >= letters.length - 1 || letters.length === 0;
}

document.getElementById('prevBtn').onclick = () => { current--; renderCard(); };
document.getElementById('nextBtn').onclick = () => { current++; renderCard(); };

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
  if(e.key === 'ArrowRight') document.getElementById('nextBtn').click();
});

async function deleteLetter(i){
  letters.splice(i,1);
  if(current >= letters.length) current = letters.length - 1;
  await persist();
  renderCard();
}



(async function init(){
  try{
    await loadLetters();
  }catch(e){
    letters = letters && letters.length ? letters : [];
  }
  current = 0;
  renderCard();
})();
</script>
